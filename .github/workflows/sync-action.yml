name: Sync Composite Action to smile-action repo

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  sync:
    name: Sync action.yml, tags, and Release to x-name15/smile-action
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout smile (source)
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Checkout smile-action (target)
        uses: actions/checkout@v4
        with:
          repository: x-name15/smile-action
          token: ${{ secrets.SMILE_ACTION_SYNC_TOKEN }}
          path: smile-action-repo
          fetch-depth: 0

      - name: Copy action.yml and README.md
        run: |
          cp .github/actions/smile-action/action.yml smile-action-repo/action.yml
          cp .github/actions/smile-action/README.md smile-action-repo/README.md

      - name: Commit and push if files changed
        working-directory: smile-action-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet action.yml README.md; then
            echo "No changes — skipping commit."
          else
            git add action.yml README.md
            git commit -m "chore: sync from x-name15/smile@${{ github.sha }}"
            git push
          fi

      - name: Sync version tags to smile-action
        working-directory: smile-action-repo
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Specific semver tag (e.g. v1.7.0)
          git tag "$VERSION" --force
          git push origin "$VERSION" --force

          # Floating major tag — always points to the latest within this major
          # e.g. v1 tracks all 1.x.x; when 2.0.0 ships, v2 is created and v1 stays at last 1.x.x
          git tag "$MAJOR" --force
          git push origin "$MAJOR" --force

          echo "Tagged smile-action as $VERSION and $MAJOR"

      - name: Create or Update GitHub Release in smile-action
        uses: softprops/action-gh-release@v2
        with:
          repository: x-name15/smile-action
          token: ${{ secrets.SMILE_ACTION_SYNC_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }} — Smile API Linter"
          body: |
            ## 😊 Smile API Linter GitHub Action

            Official composite action for [smile](https://github.com/x-name15/smile) — the relentless API contract validator for OpenAPI, AsyncAPI, GraphQL, gRPC, JSON Schema, and Postman collections.

            ### Release Highlights from Smile v${{ steps.version.outputs.version }}

            ${{ steps.notes.outputs.notes }}

            ### Quick Usage

            ```yaml
            - name: Lint API specs
              uses: x-name15/smile-action@v1
              with:
                spec-path: "."
                format: "text"
                max-warnings: 0
            ```

            View [Marketplace Listing](https://github.com/marketplace/actions/smile-api-linter) | [Full Documentation](https://github.com/x-name15/smile/blob/main/docs/ci-cd.md)
