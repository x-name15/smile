name: Smile CI Gate / Release Gate

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Verify package-lock.json is tidy
      run: |
        npm install
        if [ -n "$(git status --porcelain package-lock.json)" ]; then
          echo "package-lock.json is not tidy. Please run 'npm install' locally and commit the changes."
          git diff package-lock.json
          exit 1
        fi

    - name: Typecheck
      run: npm run typecheck

    - name: Run Tests
      run: npm test

    - name: Build JS & Types
      run: npm run build
